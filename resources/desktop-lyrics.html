<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Twilight Echo - 桌面歌词</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  }
  #lyrics-container {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
    transition: background 0.3s ease;
    border-radius: 12px;
    position: relative;
    -webkit-app-region: drag;
  }
  #lyrics-container.dragging { cursor: grabbing; }
  #lyrics-container:not(.dragging) { cursor: grab; }

  #toolbar {
    -webkit-app-region: no-drag;
  }

  .lyric-line {
    text-align: center;
    line-height: 1.4;
    transition: color 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
    opacity: 0.5;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 20px;
    will-change: transform;
  }
  .lyric-line.active {
    opacity: 1;
  }
  .lyric-line.translation {
    opacity: 0.4;
    font-size: 0.75em;
  }
  .lyric-line.translation.active {
    opacity: 0.7;
  }
  .lyric-line.empty {
    opacity: 0.2;
  }
  .lyric-word {
    opacity: 0.55;
    transition: opacity 0.15s ease;
  }
  .lyric-line.active .lyric-word {
    opacity: 0.45;
  }
  .lyric-line.active .lyric-word.active {
    opacity: 1;
  }

  #toolbar {
    position: absolute;
    top: 4px; right: 8px;
    display: flex; gap: 6px;
    opacity: 0;
    transition: opacity 0.25s ease;
    z-index: 100;
  }
  #lyrics-container:hover #toolbar { opacity: 1; }
  .toolbar-btn {
    width: 28px; height: 28px;
    border: none; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    transition: background 0.2s;
  }
  .toolbar-btn:hover { background: rgba(255,255,255,0.3); }
  .toolbar-btn svg { width: 14px; height: 14px; fill: currentColor; }

  #song-info {
    position: absolute;
    bottom: 4px; left: 12px;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  #lyrics-container:hover #song-info { opacity: 1; }
</style>
</head>
<body>
<div id="lyrics-container" data-tauri-drag-region="deep">
  <div id="toolbar">
    <button class="toolbar-btn" id="btn-close" title="关闭桌面歌词">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>
  <div id="lyrics-content"></div>
  <div id="song-info"></div>
</div>
<script src="desktop-lyrics.js"></script>
</body>
</html>
