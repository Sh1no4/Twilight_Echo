<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Twilight Echo - 桌面歌词</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  }
  #lyrics-container {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
    transition: background 0.3s ease;
    border-radius: 12px;
    position: relative;
    -webkit-app-region: drag;
  }
  #lyrics-container.dragging { cursor: grabbing; }
  #lyrics-container:not(.dragging) { cursor: grab; }

  #toolbar {
    -webkit-app-region: no-drag;
  }

  .lyric-line {
    text-align: center;
    line-height: 1.4;
    transition: color 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
    opacity: 0.5;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 20px;
  }
  .lyric-line.active {
    opacity: 1;
    transform: scale(1.05);
  }
  .lyric-line.translation {
    opacity: 0.4;
    font-size: 0.75em;
  }
  .lyric-line.translation.active {
    opacity: 0.7;
  }
  .lyric-line.empty {
    opacity: 0.2;
  }

  #toolbar {
    position: absolute;
    top: 4px; right: 8px;
    display: flex; gap: 6px;
    opacity: 0;
    transition: opacity 0.25s ease;
    z-index: 100;
  }
  #lyrics-container:hover #toolbar { opacity: 1; }
  .toolbar-btn {
    width: 28px; height: 28px;
    border: none; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    transition: background 0.2s;
  }
  .toolbar-btn:hover { background: rgba(255,255,255,0.3); }
  .toolbar-btn svg { width: 14px; height: 14px; fill: currentColor; }

  #song-info {
    position: absolute;
    bottom: 4px; left: 12px;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  #lyrics-container:hover #song-info { opacity: 1; }
</style>
</head>
<body>
<div id="lyrics-container">
  <div id="toolbar">
    <button class="toolbar-btn" id="btn-close" title="关闭桌面歌词">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>
  <div id="lyrics-content"></div>
  <div id="song-info"></div>
</div>
<script>
(function () {
  var api = window.api && window.api.desktopLyrics;
  if (!api) { console.error('desktopLyrics API not available'); return; }

  // ── State ──
  var parsedLines = [];
  var translatedLines = [];
  var mergedLines = [];
  var currentTime = 0;
  var activeIndex = -1;
  var settings = null;
  var displayLines = [];

  // ── DOM ──
  var container = document.getElementById('lyrics-container');
  var contentEl = document.getElementById('lyrics-content');
  var songInfoEl = document.getElementById('song-info');
  var btnClose = document.getElementById('btn-close');

  // ── LRC Parser ──
  function parseLrc(lrc) {
    if (!lrc) return [];
    var lines = [];
    var lineRe = /\[(\d{1,3}):(\d{2})(?:[.:](\d{2,3}))?\]/g;
    var rawLines = lrc.split('\n');
    for (var ri = 0; ri < rawLines.length; ri++) {
      var trimmed = rawLines[ri].trim();
      if (!trimmed) continue;
      var timestamps = [];
      var match;
      lineRe.lastIndex = 0;
      while ((match = lineRe.exec(trimmed)) !== null) {
        var min = parseInt(match[1], 10);
        var sec = parseInt(match[2], 10);
        var ms = 0;
        if (match[3]) { ms = parseInt(match[3], 10); if (match[3].length === 2) ms *= 10; }
        timestamps.push(min * 60 + sec + ms / 1000);
      }
      var text = trimmed.replace(lineRe, '').trim();
      if (!text || timestamps.length === 0) continue;
      for (var ti = 0; ti < timestamps.length; ti++) lines.push({ time: timestamps[ti], text: text });
    }
    lines.sort(function (a, b) { return a.time - b.time; });
    return lines;
  }

  function parsePlainLyrics(lyrics) {
    if (!lyrics) return [];
    var timeTagRe = /\[\d{1,3}:\d{2}(?:[.:]\d{2,3})?\]/g;
    var metadataTagRe = /^\[[a-zA-Z]+:.*\]$/;
    return lyrics
      .split('\n')
      .map(function (line) { return line.replace(timeTagRe, '').trim(); })
      .filter(function (line) { return line.length > 0 && !metadataTagRe.test(line); });
  }

  function mergeLyrics(original, translated) {
    if (original.length === 0) {
      return translated.map(function (l) { return { time: l.time, text: l.text, translation: null }; });
    }
    var result = original.map(function (l) { return { time: l.time, text: l.text, translation: null }; });
    if (translated.length > 0) {
      for (var i = 0; i < translated.length; i++) {
        var t = translated[i];
        var idx = -1;
        for (var j = 0; j < result.length; j++) {
          if (Math.abs(result[j].time - t.time) < 0.5) { idx = j; break; }
        }
        if (idx >= 0) result[idx].translation = t.text;
      }
    }
    return result;
  }

  function buildMergedLyrics(lyrics, translatedLyrics) {
    var original = parseLrc(lyrics);
    var translated = parseLrc(translatedLyrics);
    if (original.length > 0 || translated.length > 0) return mergeLyrics(original, translated);

    var plain = parsePlainLyrics(lyrics);
    var plainTranslated = parsePlainLyrics(translatedLyrics);
    var source = plain.length > 0 ? plain : plainTranslated;
    return source.map(function (line, index) {
      return {
        time: null,
        text: line,
        translation: plain.length > 0 ? plainTranslated[index] || null : null
      };
    });
  }

  // ── Rendering ──
  function hexToRgba(hex, alpha) {
    if (!hex || !hex.startsWith('#')) return 'rgba(0,0,0,' + alpha + ')';
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function applySettings(s) {
    settings = s;
    var fontFamily = s.fontFamily === 'system' || !s.fontFamily
      ? "system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif"
      : s.fontFamily;
    container.style.fontFamily = fontFamily;
    container.style.fontSize = s.fontSize + 'px';
    container.style.fontWeight = String(s.fontWeight);

    var bgAlpha = s.bgOpacity / 100;
    container.style.background = s.bgOpacity > 0 ? hexToRgba(s.bgColor, bgAlpha) : 'transparent';

    container.style.textAlign = s.align;
    container.style.justifyContent = s.align === 'left' ? 'flex-start' : 'center';
    container.style.alignItems = s.align === 'left' ? 'flex-start' : 'center';

    renderLines();
  }

  function renderLines() {
    contentEl.innerHTML = '';
    displayLines = [];
    if (!settings) return;

    var maxLines = settings.maxLines || 2;
    var showTranslation = settings.showTranslation !== false;
    var shadow = settings.shadow ? '0 0 ' + settings.shadowBlur + 'px ' + settings.shadowColor : 'none';

    var startIdx = 0;
    var count = Math.min(maxLines, mergedLines.length);
    if (activeIndex >= 0) {
      startIdx = Math.max(0, activeIndex - Math.floor((count - 1) / 2));
      if (startIdx + count > mergedLines.length) {
        startIdx = Math.max(0, mergedLines.length - count);
      }
    }

    for (var i = 0; i < count; i++) {
      var lineIdx = startIdx + i;
      var line = mergedLines[lineIdx];
      if (!line) continue;

      var div = document.createElement('div');
      div.className = 'lyric-line';
      div.dataset.index = String(lineIdx);

      var isActive = lineIdx === activeIndex;
      if (isActive) div.classList.add('active');
      if (!line.text) div.classList.add('empty');

      div.style.color = isActive ? settings.highlightColor : settings.color;
      div.style.textShadow = shadow;

      if (line.text) {
        div.textContent = line.text;
      } else {
        div.innerHTML = '&nbsp;';
      }

      contentEl.appendChild(div);
      displayLines.push({ el: div, index: lineIdx });

      if (showTranslation && line.translation) {
        var transDiv = document.createElement('div');
        transDiv.className = 'lyric-line translation';
        if (isActive) transDiv.classList.add('active');
        transDiv.style.color = isActive ? settings.highlightColor : settings.color;
        transDiv.style.textShadow = shadow;
        transDiv.textContent = line.translation;
        contentEl.appendChild(transDiv);
      }
    }

    if (settings) {
      contentEl.style.lineHeight = String(settings.lineSpacing);
    }
  }

  function updateActiveIndex() {
    var newActive = -1;
    for (var i = 0; i < mergedLines.length; i++) {
      if (mergedLines[i].time == null) continue;
      if (mergedLines[i].time <= currentTime) {
        newActive = i;
      } else {
        break;
      }
    }
    if (newActive !== activeIndex) {
      activeIndex = newActive;
      renderLines();
    }
  }

  // ── IPC via window.api ──
  api.onInitSettings(function (s) { applySettings(s); });
  api.onTrackUpdate(function (data) {
    parsedLines = parseLrc(data.lyrics);
    translatedLines = parseLrc(data.translatedLyrics);
    mergedLines = buildMergedLyrics(data.lyrics, data.translatedLyrics);
    activeIndex = -1;
    if (data.title) {
      songInfoEl.textContent = (data.artist ? data.artist + ' - ' : '') + data.title;
    } else {
      songInfoEl.textContent = '';
    }
    renderLines();
  });
  api.onTimeUpdate(function (time) {
    currentTime = time;
    updateActiveIndex();
  });
  api.onSettingsUpdate(function (s) { applySettings(s); });

  // Dragging is handled natively by -webkit-app-region: drag on #lyrics-container.
  // The main process 'move' event handler auto-saves the window position.

  // ── Close button ──
  btnClose.addEventListener('click', function () {
    api.requestClose();
  });
})();
</script>
</body>
</html>
