<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twilight Echo - 桌面歌词</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
      }
      #lyrics-container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        transition: background 0.3s ease;
        border-radius: 12px;
        position: relative;
        -webkit-app-region: drag;
      }
      #lyrics-container.dragging {
        cursor: grabbing;
      }
      #lyrics-container:not(.dragging) {
        cursor: grab;
      }

      #toolbar {
        position: absolute;
        top: 10px;
        right: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        transform: translateY(-4px);
        z-index: 100;
        -webkit-app-region: no-drag;
      }
      #lyrics-container:hover #toolbar,
      #lyrics-container:focus-within #toolbar,
      #lyrics-container.locked.temp-unlocked #toolbar {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }
      .toolbar-surface {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;
        max-width: calc(100vw - 24px);
        min-height: 36px;
        padding: 4px 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        background: rgba(16, 18, 24, 0.78);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(16px) saturate(1.25);
      }
      .toolbar-select {
        height: 28px;
        min-width: 74px;
        padding: 0 6px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 7px;
        outline: none;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.92);
        font: inherit;
        font-size: 11px;
        -webkit-app-region: no-drag;
      }
      .toolbar-select.font-select {
        width: 138px;
      }
      .toolbar-select.weight-select {
        width: 62px;
        min-width: 62px;
      }
      .toolbar-select.align-select {
        width: 64px;
        min-width: 64px;
      }
      .toolbar-select option,
      .toolbar-select optgroup {
        background: #17191f;
        color: #fff;
      }
      .toolbar-btn,
      .toolbar-step {
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.92);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          600 12px/1 system-ui,
          sans-serif;
        transition:
          background 0.2s ease,
          color 0.2s ease;
        -webkit-app-region: no-drag;
      }
      .toolbar-btn:hover,
      .toolbar-step:hover,
      .toolbar-select:hover,
      .toolbar-select:focus {
        background: rgba(255, 255, 255, 0.22);
      }
      .toolbar-btn svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }
      .toolbar-divider {
        width: 1px;
        height: 18px;
        margin: 0 2px;
        background: rgba(255, 255, 255, 0.18);
      }
      #font-size-value {
        min-width: 30px;
        color: rgba(255, 255, 255, 0.75);
        font-size: 11px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      #btn-color {
        position: relative;
      }
      #color-swatch {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.7);
      }
      .toolbar-popover {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 12px;
        width: min(488px, calc(100vw - 24px));
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        background: rgba(16, 18, 24, 0.92);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(18px) saturate(1.2);
      }
      .toolbar-popover[hidden] {
        display: none;
      }
      .popover-title {
        grid-column: 1 / -1;
        margin-bottom: 2px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 11px;
      }
      .color-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        min-width: 0;
        height: 26px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 11px;
      }
      .color-row input[type='color'] {
        width: 36px;
        height: 22px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 5px;
        background: transparent;
        cursor: pointer;
      }
      .color-row input[type='range'] {
        flex: 1 1 90px;
        min-width: 48px;
        accent-color: var(--dl-highlight);
      }
      .color-range-value {
        width: 28px;
        text-align: right;
        color: rgba(255, 255, 255, 0.55);
        font-variant-numeric: tabular-nums;
      }
      @media (max-height: 200px) {
        .toolbar-popover {
          padding: 6px 8px;
        }
        .toolbar-popover .popover-title {
          display: none;
        }
      }

      #lyrics-container.netease #lyrics-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        gap: 2px;
      }
      #lyrics-container.netease .lyric-line {
        transform: none !important;
        transition:
          color 0.24s ease,
          opacity 0.24s ease,
          transform 0.24s ease;
      }
      #lyrics-container.netease .lyric-line.active {
        font-size: 1em;
        opacity: 1;
      }
      #lyrics-container.netease .lyric-line.preview {
        font-size: 0.78em;
        opacity: 0.48;
      }
      #lyrics-container.netease .lyric-line.translation.active {
        font-size: 0.62em;
        opacity: 0.68;
      }
      .karaoke-text {
        position: relative;
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .karaoke-text::after {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        color: transparent;
        background-image: linear-gradient(
          90deg,
          #ffffff 0%,
          var(--dl-highlight) 72%,
          var(--dl-highlight) 100%
        );
        background-size: 100% 100%;
        background-position-x: 0;
        -webkit-background-clip: text;
        background-clip: text;
        clip-path: inset(0 calc((1 - var(--progress)) * 100%) 0 0);
        pointer-events: none;
      }

      .lyric-line {
        text-align: center;
        line-height: 1.4;
        transition:
          color 0.3s ease,
          opacity 0.3s ease,
          transform 0.3s ease;
        opacity: 0.5;
        white-space: nowrap;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 20px;
        will-change: transform;
      }
      .lyric-line.active {
        opacity: 1;
      }
      .lyric-line.translation {
        opacity: 0.4;
        font-size: 0.75em;
      }
      .lyric-line.translation.active {
        opacity: 0.7;
      }
      .lyric-line.empty {
        opacity: 0.2;
      }
      .lyric-word {
        opacity: 0.55;
        transition: opacity 0.15s ease;
      }
      .lyric-line.active .lyric-word {
        opacity: 0.45;
      }
      .lyric-line.active .lyric-word.active {
        opacity: 1;
      }

      #song-info {
        position: absolute;
        bottom: 4px;
        left: 12px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
      }
      #lyrics-container:hover #song-info {
        opacity: 1;
      }
      #lyrics-container.locked {
        cursor: default;
        -webkit-app-region: no-drag;
      }
      #lyrics-container.locked #toolbar,
      #lyrics-container.locked #song-info {
        opacity: 0;
        pointer-events: none;
      }
      #lyrics-container.locked.temp-unlocked #toolbar,
      #lyrics-container.locked.temp-unlocked #song-info {
        opacity: 1;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="lyrics-container">
      <div id="toolbar">
        <div class="toolbar-surface">
          <select
            id="font-select"
            class="toolbar-select font-select"
            title="选择歌词字体"
            aria-label="选择歌词字体"
          >
            <option value="follow">跟随界面</option>
            <option value="system">系统默认</option>
            <option value="inter">Inter / Roboto</option>
            <option value="lxgw">霞鹜文楷</option>
            <option value="sarasa">更纱黑体</option>
            <option value="comic">Comic Sans</option>
          </select>
          <span class="toolbar-divider"></span>
          <button
            class="toolbar-step"
            id="btn-font-decrease"
            title="减小字号"
            aria-label="减小字号"
          >
            A-
          </button>
          <span id="font-size-value">32</span>
          <button
            class="toolbar-step"
            id="btn-font-increase"
            title="增大字号"
            aria-label="增大字号"
          >
            A+
          </button>
          <select
            id="weight-select"
            class="toolbar-select weight-select"
            title="选择字重"
            aria-label="选择字重"
          >
            <option value="300">细体</option>
            <option value="400">常规</option>
            <option value="500">中等</option>
            <option value="600">半粗</option>
            <option value="700">粗体</option>
            <option value="800">特粗</option>
            <option value="900">黑体</option>
          </select>
          <button
            class="toolbar-btn"
            id="btn-color"
            title="调整歌词颜色"
            aria-label="调整歌词颜色"
            aria-expanded="false"
          >
            <span id="color-swatch"></span>
          </button>
          <select
            id="align-select"
            class="toolbar-select align-select"
            title="选择歌词对齐"
            aria-label="选择歌词对齐"
          >
            <option value="center">居中</option>
            <option value="left">靠左</option>
          </select>
          <button class="toolbar-btn" id="btn-lock" title="锁定桌面歌词" aria-label="锁定桌面歌词">
            <svg viewBox="0 0 24 24">
              <path
                d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9zm-8-2a3 3 0 0 1 6 0v2H9zm3 7a2 2 0 0 1 1 3.72V19h-2v-1.28A2 2 0 0 1 12 14"
              />
            </svg>
          </button>
          <button class="toolbar-btn" id="btn-close" title="关闭桌面歌词" aria-label="关闭桌面歌词">
            <svg viewBox="0 0 24 24">
              <path
                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
              />
            </svg>
          </button>
        </div>
        <div id="color-panel" class="toolbar-popover" hidden>
          <div class="popover-title">歌词配色</div>
          <label class="color-row"
            ><span>默认文字</span><input id="color-default" type="color"
          /></label>
          <label class="color-row"
            ><span>当前高亮</span><input id="color-highlight" type="color"
          /></label>
          <label class="color-row"
            ><span>背景颜色</span><input id="color-background" type="color"
          /></label>
          <label class="color-row"
            ><span>背景透明度</span
            ><input id="opacity-background" type="range" min="0" max="100" step="5" /><span
              id="opacity-background-value"
              class="color-range-value"
              >30%</span
            ></label
          >
        </div>
      </div>
      <div id="lyrics-content"></div>
      <div id="song-info"></div>
    </div>
    <script src="./desktop-lyrics-presentation.js"></script>
    <script>
      ;(function () {
        var api = window.api && window.api.desktopLyrics
        if (!api) {
          console.error('desktopLyrics API not available')
          var contentMissing = document.getElementById('lyrics-content')
          if (contentMissing) contentMissing.textContent = '桌面歌词加载失败：API 不可用'
          return
        }

        // ── State ──
        var mergedLines = []
        var currentTime = 0
        var activeIndex = -1
        var activeWordIndex = -1
        var settings = null
        var displayLines = []

        // ── DOM ──
        var container = document.getElementById('lyrics-container')
        var contentEl = document.getElementById('lyrics-content')
        var toolbar = document.getElementById('toolbar')
        var songInfoEl = document.getElementById('song-info')
        var btnClose = document.getElementById('btn-close')
        var btnLock = document.getElementById('btn-lock')
        var btnFontDecrease = document.getElementById('btn-font-decrease')
        var btnFontIncrease = document.getElementById('btn-font-increase')
        var btnColor = document.getElementById('btn-color')
        var fontSelect = document.getElementById('font-select')
        var fontSizeValue = document.getElementById('font-size-value')
        var weightSelect = document.getElementById('weight-select')
        var alignSelect = document.getElementById('align-select')
        var colorPanel = document.getElementById('color-panel')
        var colorDefault = document.getElementById('color-default')
        var colorHighlight = document.getElementById('color-highlight')
        var colorBackground = document.getElementById('color-background')
        var opacityBackground = document.getElementById('opacity-background')
        var opacityBackgroundValue = document.getElementById('opacity-background-value')

        // ── LRC / YRC Parser ──
        // NetEase lyric/new metadata & prose: {"t":-1,"c":[{"tx":"作词: "},{"tx":"ACO"}]}
        var NETEASE_JSON_LINE_RE = /^\s*\{[\s\S]*"c"\s*:\s*\[[\s\S]*\]\s*\}\s*$/
        var VOICE_TAG_RE = /\[te:voice\s+([^\]]+)\]/g

        function isValidVoiceTag(tag) {
          var match = /^\[te:voice\s+([^\]]+)\]$/.exec(tag)
          if (!match) return false
          var values = Object.create(null)
          var fields = match[1].trim().split(/\s+/)
          for (var i = 0; i < fields.length; i++) {
            var separator = fields[i].indexOf('=')
            if (separator <= 0 || separator === fields[i].length - 1) return false
            var key = fields[i].slice(0, separator)
            var value = fields[i].slice(separator + 1)
            if (!/^(role|lane|speaker|group)$/.test(key) || values[key]) return false
            if (!/^(?:[A-Za-z0-9._~-]|%[0-9A-Fa-f]{2})+$/.test(value)) return false
            try {
              var decoded = decodeURIComponent(value)
              if (!decoded || decoded.length > 96 || /[\u0000-\u001f\u007f]/.test(decoded))
                return false
            } catch (e) {
              return false
            }
            values[key] = value
          }
          return (
            /^(lead|background|harmony)$/.test(values.role || '') &&
            /^(center|start|end)$/.test(values.lane || '')
          )
        }

        function stripValidVoiceTag(raw) {
          return String(raw || '').replace(VOICE_TAG_RE, function (tag) {
            return isValidVoiceTag(tag) ? '' : tag
          })
        }

        function looksLikeYrc(lyrics) {
          return (
            typeof lyrics === 'string' &&
            /^\[\d+,\d+\]/m.test(lyrics) &&
            /\(\d+,\d+,\d+\)/.test(lyrics)
          )
        }

        function parseNeteaseJsonLyricLine(raw) {
          var trimmed = String(raw || '').trim()
          if (!trimmed || trimmed[0] !== '{' || !NETEASE_JSON_LINE_RE.test(trimmed)) return null
          try {
            var parsed = JSON.parse(trimmed)
            if (!Array.isArray(parsed.c)) return null
            var text = parsed.c
              .map(function (part) {
                return part && typeof part.tx === 'string' ? part.tx : ''
              })
              .join('')
              .replace(/\s+/g, ' ')
              .trim()
            if (!text) return null
            var timeMs = typeof parsed.t === 'number' && isFinite(parsed.t) ? parsed.t : null
            // t < 0 is NetEase credit / static metadata (作词 / 作曲 / 制作), not a playhead time.
            var time = timeMs != null && timeMs >= 0 ? timeMs / 1000 : null
            return { time: time, text: text }
          } catch (e) {
            return null
          }
        }

        function isRawNeteaseJsonLyricLine(raw) {
          var trimmed = String(raw || '').trim()
          return trimmed.charAt(0) === '{' && NETEASE_JSON_LINE_RE.test(trimmed)
        }

        function parseYrc(yrc) {
          if (!yrc) return []
          var lines = []
          var credits = []
          var rawLines = yrc.split('\n')
          var lineRe = /^\[(\d+),(\d+)\](.*)$/
          var wordRe = /\((\d+),(\d+),\d+\)([^(]*)/g
          for (var ri = 0; ri < rawLines.length; ri++) {
            var trimmed = rawLines[ri].trim()
            if (!trimmed) continue

            var jsonLine = parseNeteaseJsonLyricLine(trimmed)
            if (jsonLine) {
              if (jsonLine.time != null) {
                lines.push({ time: jsonLine.time, text: jsonLine.text, words: null })
              } else {
                // Credits (t:-1) at top with t=0 so they don't scroll as timed lines.
                credits.push({ time: 0, text: jsonLine.text, words: null })
              }
              continue
            }
            if (isRawNeteaseJsonLyricLine(trimmed)) continue

            var stripped = stripValidVoiceTag(trimmed)
            var m = lineRe.exec(stripped)
            if (!m) continue
            var startMs = parseInt(m[1], 10)
            var rest = m[3] || ''
            var words = []
            var text = ''
            wordRe.lastIndex = 0
            var wm
            while ((wm = wordRe.exec(rest)) !== null) {
              var wordStart = parseInt(wm[1], 10) / 1000
              var wordText = wm[3] || ''
              words.push({ time: wordStart, text: wordText })
              text += wordText
            }
            if (!text) continue
            lines.push({
              time: startMs / 1000,
              text: text,
              words: words.length ? words : null
            })
          }
          lines.sort(function (a, b) {
            return a.time - b.time
          })
          return credits.length > 0 ? credits.concat(lines) : lines
        }

        function parseTimestampParts(min, sec, frac) {
          var ms = 0
          if (frac) {
            ms = parseInt(frac, 10)
            if (frac.length === 2) ms *= 10
          }
          return parseInt(min, 10) * 60 + parseInt(sec, 10) + ms / 1000
        }

        function parseEnhancedWords(rawLine) {
          var wordRe = /<(\d{1,3}):(\d{2})(?:[.:](\d{2,3}))?>/g
          if (!wordRe.test(rawLine)) return null
          var timestamps = []
          var match
          wordRe.lastIndex = 0
          while ((match = wordRe.exec(rawLine)) !== null) {
            timestamps.push({
              time: parseTimestampParts(match[1], match[2], match[3]),
              index: match.index,
              end: match.index + match[0].length
            })
          }
          if (timestamps.length === 0) return null
          var words = []
          var plain = ''
          for (var i = 0; i < timestamps.length; i++) {
            var current = timestamps[i]
            var next = timestamps[i + 1]
            var wordText = rawLine.slice(current.end, next ? next.index : rawLine.length)
            if (!wordText) continue
            words.push({ time: current.time, text: wordText })
            plain += wordText
          }
          var lineRe = /\[(\d{1,3}):(\d{2})(?:[.:](\d{2,3}))?\]/g
          var cleaned = plain.replace(lineRe, '').trim()
          if (!cleaned || words.length === 0) return null
          return { text: cleaned, words: words }
        }

        function parseLrc(lrc) {
          if (!lrc) return []
          var lines = []
          var credits = []
          var lineRe = /\[(\d{1,3}):(\d{2})(?:[.:](\d{2,3}))?\]/g
          var rawLines = lrc.split('\n')
          for (var ri = 0; ri < rawLines.length; ri++) {
            var trimmed = rawLines[ri].trim()
            if (!trimmed) continue

            var jsonLine = parseNeteaseJsonLyricLine(trimmed)
            if (jsonLine) {
              if (jsonLine.time != null) {
                lines.push({ time: jsonLine.time, text: jsonLine.text, words: null })
              } else {
                credits.push({ time: 0, text: jsonLine.text, words: null })
              }
              continue
            }
            if (isRawNeteaseJsonLyricLine(trimmed)) continue

            var stripped = stripValidVoiceTag(trimmed)
            var timestamps = []
            var match
            lineRe.lastIndex = 0
            while ((match = lineRe.exec(stripped)) !== null) {
              timestamps.push(parseTimestampParts(match[1], match[2], match[3]))
            }
            var enhanced = parseEnhancedWords(stripped)
            var text = enhanced
              ? enhanced.text
              : stripped
                  .replace(lineRe, '')
                  .replace(/<[^>]+>/g, '')
                  .trim()
            var words = enhanced ? enhanced.words : null
            if (!text || timestamps.length === 0) continue
            for (var ti = 0; ti < timestamps.length; ti++) {
              lines.push({ time: timestamps[ti], text: text, words: words })
            }
          }
          lines.sort(function (a, b) {
            return a.time - b.time
          })
          return credits.length > 0 ? credits.concat(lines) : lines
        }

        function parsePlainLyrics(lyrics) {
          if (!lyrics) return []
          var timeTagRe = /\[\d{1,3}:\d{2}(?:[.:]\d{2,3})?\]/g
          var metadataTagRe = /^\[[a-zA-Z]+:.*\]$/
          return lyrics
            .split('\n')
            .map(function (line) {
              var jsonLine = parseNeteaseJsonLyricLine(line)
              if (jsonLine) return jsonLine.text
              if (isRawNeteaseJsonLyricLine(line)) return ''
              return stripValidVoiceTag(line)
                .replace(timeTagRe, '')
                .replace(/<[^>]+>/g, '')
                .trim()
            })
            .filter(function (line) {
              return line.length > 0 && !metadataTagRe.test(line)
            })
        }

        function mergeLyrics(original, translated) {
          if (original.length === 0) {
            return translated.map(function (l) {
              return { time: l.time, text: l.text, translation: null, words: l.words || null }
            })
          }
          var result = original.map(function (l) {
            return { time: l.time, text: l.text, translation: null, words: l.words || null }
          })
          if (translated.length > 0) {
            for (var i = 0; i < translated.length; i++) {
              var t = translated[i]
              var idx = -1
              for (var j = 0; j < result.length; j++) {
                if (result[j].time == null || t.time == null) continue
                if (Math.abs(result[j].time - t.time) < 0.5) {
                  idx = j
                  break
                }
              }
              if (idx >= 0) result[idx].translation = t.text
            }
          }
          return result
        }

        function buildMergedLyrics(lyrics, translatedLyrics) {
          var original = looksLikeYrc(lyrics) ? parseYrc(lyrics) : parseLrc(lyrics)
          var translated = looksLikeYrc(translatedLyrics)
            ? parseYrc(translatedLyrics)
            : parseLrc(translatedLyrics)
          if (original.length > 0 || translated.length > 0) return mergeLyrics(original, translated)

          var plain = parsePlainLyrics(lyrics)
          var plainTranslated = parsePlainLyrics(translatedLyrics)
          var source = plain.length > 0 ? plain : plainTranslated
          return source.map(function (line, index) {
            return {
              time: null,
              text: line,
              translation: plain.length > 0 ? plainTranslated[index] || null : null,
              words: null
            }
          })
        }

        function lyricSourceLabel(source) {
          if (source === 'embedded') return '内嵌'
          if (source === 'local') return '本地 LRC'
          if (source === 'provider') return 'Provider'
          if (source === 'online') return '在线'
          return ''
        }

        function buildSourceLabel(data) {
          var labels = []
          var original = lyricSourceLabel(data.lyricsSource)
          var translated = lyricSourceLabel(data.translatedLyricsSource)
          if (original) labels.push('原文: ' + original)
          if (translated) labels.push('翻译: ' + translated)
          return labels.join(' / ')
        }

        // ── Rendering ──
        function hexToRgba(hex, alpha) {
          if (!hex || !hex.startsWith('#')) return 'rgba(0,0,0,' + alpha + ')'
          var r = parseInt(hex.slice(1, 3), 16)
          var g = parseInt(hex.slice(3, 5), 16)
          var b = parseInt(hex.slice(5, 7), 16)
          return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')'
        }

        function applySettings(s) {
          settings = s
          var effectiveFont = s.resolvedFontFamily || s.fontFamily
          var fontFamily =
            effectiveFont === 'system' || effectiveFont === 'follow' || !effectiveFont
              ? "system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif"
              : effectiveFont
          container.style.fontFamily = fontFamily
          container.style.fontSize = s.fontSize + 'px'
          container.style.fontWeight = String(s.fontWeight)

          var bgAlpha = s.bgOpacity / 100
          container.style.background =
            s.bgOpacity > 0 ? hexToRgba(s.bgColor, bgAlpha) : 'transparent'

          container.style.textAlign = s.align
          container.style.justifyContent = 'center'
          container.style.alignItems = 'center'
          contentEl.style.alignItems = s.align === 'left' ? 'flex-start' : 'center'
          container.classList.toggle('netease', s.presentation !== 'classic')
          container.classList.toggle('locked', s.locked === true)
          container.classList.toggle('temp-unlocked', s.locked === true && tempInteractive)
          container.style.setProperty('--dl-highlight', s.highlightColor)
          btnLock.title = s.locked ? '解锁桌面歌词' : '锁定桌面歌词'
          btnLock.setAttribute('aria-label', btnLock.title)
          fontSelect.value = s.fontFamily || 'system'
          if (!fontSelect.value) appendInstalledFontOption(s.fontFamily)
          fontSelect.value = s.fontFamily || 'system'
          fontSizeValue.textContent = String(s.fontSize)
          weightSelect.value = String(s.fontWeight)
          alignSelect.value = s.align === 'left' ? 'left' : 'center'
          colorDefault.value = s.color
          colorHighlight.value = s.highlightColor
          colorBackground.value = s.bgColor
          opacityBackground.value = String(s.bgOpacity)
          opacityBackgroundValue.textContent = s.bgOpacity + '%'
          document.getElementById('color-swatch').style.background = s.highlightColor
          updateTempInteraction()

          renderLines()
        }

        function appendLyricRow(opts) {
          var text = opts.text
          var isActive = opts.isActive
          var isTranslation = opts.isTranslation
          var rowIndex = opts.rowIndex
          var lineIdx = opts.lineIdx
          var words = opts.words
          var shadow = opts.shadow
          var lineOffset = opts.lineOffset
          var canKaraoke =
            settings.presentation === 'netease' &&
            isActive &&
            !isTranslation &&
            TwilightDesktopLyricsPresentation.hasWordTiming({ words: words })

          var rowOffsetX = (rowIndex % 2 === 0 ? -1 : 1) * lineOffset
          var parts = []
          if (rowOffsetX !== 0) parts.push('translateX(' + rowOffsetX + 'px)')
          if (isActive && !isTranslation) parts.push('scale(1.05)')
          var rowTransform = parts.length ? parts.join(' ') : ''

          var div = document.createElement('div')
          div.className = 'lyric-line' + (isTranslation ? ' translation' : '')
          if (lineIdx != null) div.dataset.index = String(lineIdx)
          if (isActive) div.classList.add('active')
          if (!text) div.classList.add('empty')

          div.style.color = canKaraoke
            ? settings.color
            : isActive
              ? settings.highlightColor
              : settings.color
          div.style.textShadow = shadow
          div.style.textAlign = settings.align === 'left' ? 'left' : 'center'
          div.style.width = '100%'
          if (rowTransform) div.style.transform = rowTransform

          var textSpan = document.createElement('span')
          textSpan.className = canKaraoke ? 'karaoke-text' : ''
          if (
            settings.presentation !== 'netease' &&
            !isTranslation &&
            isActive &&
            words &&
            words.length
          ) {
            for (var wi = 0; wi < words.length; wi++) {
              var span = document.createElement('span')
              span.className = 'lyric-word' + (wi === activeWordIndex ? ' active' : '')
              span.textContent = words[wi].text
              textSpan.appendChild(span)
            }
          } else {
            textSpan.textContent = text || '\u00a0'
          }
          if (canKaraoke) textSpan.dataset.text = text || '\u00a0'
          div.appendChild(textSpan)

          contentEl.appendChild(div)
          displayLines.push({ el: div, index: lineIdx })
        }

        function renderLines() {
          contentEl.innerHTML = ''
          displayLines = []
          if (!settings) return

          var maxLines = settings.maxLines || 2
          var showTranslation = settings.showTranslation !== false
          var layout = settings.layout === 'multi' ? 'multi' : 'bilingual'
          var shadow = settings.shadow
            ? '0 0 ' + settings.shadowBlur + 'px ' + settings.shadowColor
            : 'none'
          var lineOffset =
            typeof settings.lineOffset === 'number' && isFinite(settings.lineOffset)
              ? settings.lineOffset
              : 0

          if (settings.presentation === 'netease') {
            var rows = TwilightDesktopLyricsPresentation.resolveNetEaseRows(
              mergedLines,
              activeIndex,
              {
                showTranslation: showTranslation
              }
            )
            for (var rowIndex = 0; rowIndex < rows.length; rowIndex++) {
              var row = rows[rowIndex]
              appendLyricRow({
                text: row.text,
                isActive: row.isActive,
                isTranslation: row.isTranslation,
                rowIndex: rowIndex,
                lineIdx: row.lineIndex,
                words: row.lineIndex == null ? null : mergedLines[row.lineIndex].words,
                shadow: shadow,
                lineOffset: 0
              })
              var renderedRow = displayLines[displayLines.length - 1]
              renderedRow.el.classList.add(row.isActive ? 'active' : 'preview')
              if (renderedRow.el.querySelector('.karaoke-text')) {
                renderedRow.el.style.setProperty(
                  '--progress',
                  String(
                    TwilightDesktopLyricsPresentation.calculateLineProgress(
                      mergedLines,
                      activeIndex,
                      currentTime
                    )
                  )
                )
              }
            }
            contentEl.style.lineHeight = String(settings.lineSpacing)
            return
          }

          // Bilingual: row0 = original of current line, row1 = translation of current line.
          if (layout === 'bilingual') {
            var bIdx = activeIndex >= 0 ? activeIndex : mergedLines.length > 0 ? 0 : -1
            var bLine = bIdx >= 0 ? mergedLines[bIdx] : null
            if (bLine) {
              var bActive = activeIndex >= 0 && bIdx === activeIndex
              appendLyricRow({
                text: bLine.text,
                isActive: bActive,
                isTranslation: false,
                rowIndex: 0,
                lineIdx: bIdx,
                words: bLine.words,
                shadow: shadow,
                lineOffset: lineOffset
              })
              if (showTranslation) {
                appendLyricRow({
                  text: bLine.translation || '',
                  isActive: bActive,
                  isTranslation: true,
                  rowIndex: 1,
                  lineIdx: bIdx,
                  words: null,
                  shadow: shadow,
                  lineOffset: lineOffset
                })
              }
            }
            contentEl.style.lineHeight = String(settings.lineSpacing)
            return
          }

          // Single-lyric rotation (not whole-page flip):
          // maxLines=2:
          //   active=0 → [0,1] hl row0
          //   active=1 → [2,1] hl row1  (row0 already switches to the 3rd lyric)
          //   active=2 → [2,3] hl row0
          //   active=3 → [4,3] hl row1
          // Rows already past the highlight are prefilled with the next cycle's lyrics.
          var lineIndices = []
          if (mergedLines.length === 0 || maxLines <= 0) {
            lineIndices = []
          } else if (activeIndex < 0) {
            for (var pi = 0; pi < Math.min(maxLines, mergedLines.length); pi++) {
              lineIndices.push(pi)
            }
          } else {
            var pageSize = maxLines
            var base = Math.floor(activeIndex / pageSize) * pageSize
            var pos = activeIndex - base
            for (var ri = 0; ri < pageSize; ri++) {
              var idx
              if (ri < pos) {
                idx = base + pageSize + ri
              } else {
                idx = base + ri
              }
              if (idx >= 0 && idx < mergedLines.length) {
                lineIndices.push(idx)
              }
            }
            if (lineIndices.length === 0 && activeIndex < mergedLines.length) {
              lineIndices.push(activeIndex)
            }
          }

          // Even visual rows shift left, odd rows right (lineOffset px). Translation follows its line.
          for (var i = 0; i < lineIndices.length; i++) {
            var lineIdx = lineIndices[i]
            var line = mergedLines[lineIdx]
            if (!line) continue
            var isActive = lineIdx === activeIndex

            appendLyricRow({
              text: line.text,
              isActive: isActive,
              isTranslation: false,
              rowIndex: i,
              lineIdx: lineIdx,
              words: line.words,
              shadow: shadow,
              lineOffset: lineOffset
            })

            if (showTranslation && line.translation) {
              appendLyricRow({
                text: line.translation,
                isActive: isActive,
                isTranslation: true,
                rowIndex: i,
                lineIdx: lineIdx,
                words: null,
                shadow: shadow,
                lineOffset: lineOffset
              })
            }
          }

          contentEl.style.lineHeight = String(settings.lineSpacing)
        }

        // YRC word ticks do not change the visible line set. Toggle the existing
        // spans in place instead of clearing and rebuilding every row at up to 5Hz.
        function updateActiveWordClasses() {
          for (var i = 0; i < displayLines.length; i++) {
            var row = displayLines[i]
            if (row.index !== activeIndex || row.el.classList.contains('translation')) continue
            var words = row.el.querySelectorAll('.lyric-word')
            for (var wi = 0; wi < words.length; wi++) {
              words[wi].classList.toggle('active', wi === activeWordIndex)
            }
            return
          }
        }

        function refreshKaraokeProgress() {
          if (!settings || settings.presentation === 'classic' || activeIndex < 0) return
          if (!TwilightDesktopLyricsPresentation.hasWordTiming(mergedLines[activeIndex])) return
          var progress = TwilightDesktopLyricsPresentation.calculateLineProgress(
            mergedLines,
            activeIndex,
            currentTime
          )
          for (var i = 0; i < displayLines.length; i++) {
            var row = displayLines[i]
            if (row.index !== activeIndex || row.el.classList.contains('translation')) continue
            row.el.style.setProperty('--progress', String(progress))
            break
          }
        }

        function updateActiveIndex() {
          var newActive = -1
          for (var i = 0; i < mergedLines.length; i++) {
            if (mergedLines[i].time == null) continue
            if (mergedLines[i].time <= currentTime) {
              newActive = i
            } else {
              break
            }
          }
          var newWord = -1
          if (
            newActive >= 0 &&
            mergedLines[newActive].words &&
            mergedLines[newActive].words.length
          ) {
            var words = mergedLines[newActive].words
            for (var wi = 0; wi < words.length; wi++) {
              if (words[wi].time <= currentTime) newWord = wi
              else break
            }
          }
          if (newActive !== activeIndex) {
            activeIndex = newActive
            activeWordIndex = newWord
            renderLines()
          } else if (newWord !== activeWordIndex) {
            activeWordIndex = newWord
            updateActiveWordClasses()
          } else {
            refreshKaraokeProgress()
          }
        }

        function appendInstalledFontOption(fontFamily) {
          if (!fontFamily || /^(follow|system|inter|lxgw|sarasa|comic)$/.test(fontFamily)) return
          for (var i = 0; i < fontSelect.options.length; i++) {
            if (fontSelect.options[i].value === fontFamily) return
          }
          var option = document.createElement('option')
          option.value = fontFamily
          option.textContent = fontFamily
          fontSelect.appendChild(option)
        }

        function updateSettingsPatch(patch) {
          if (!settings) return
          api.updateSettings(patch)
        }

        function setColorPanelOpen(open) {
          colorPanel.hidden = !open
          btnColor.setAttribute('aria-expanded', open ? 'true' : 'false')
        }

        api
          .listInstalledFonts()
          .then(function (fonts) {
            if (!Array.isArray(fonts) || fonts.length === 0) return
            var group = document.createElement('optgroup')
            group.label = '本机字体'
            fonts.slice(0, 200).forEach(function (font) {
              var option = document.createElement('option')
              option.value = font
              option.textContent = font
              group.appendChild(option)
            })
            fontSelect.appendChild(group)
            if (settings) fontSelect.value = settings.fontFamily || 'system'
          })
          .catch(function () {})

        var tempInteractive = false
        var pendingInteractiveValue = false
        function updateTempInteraction() {
          if (tempInteractive === pendingInteractiveValue) return
          pendingInteractiveValue = tempInteractive
          api.setInteractive(tempInteractive)
        }

        function shouldShowUnlockAffordance(event) {
          var rect = toolbar.getBoundingClientRect()
          return (
            event.clientX >= rect.left - 12 &&
            event.clientX <= rect.right + 12 &&
            event.clientY >= rect.top - 12 &&
            event.clientY <= rect.bottom + 12
          )
        }

        document.addEventListener('pointermove', function (event) {
          if (!settings || !settings.locked) return
          var next = shouldShowUnlockAffordance(event)
          if (next !== tempInteractive) {
            tempInteractive = next
            container.classList.toggle('temp-unlocked', next)
            updateTempInteraction()
          }
        })
        document.addEventListener('pointerleave', function () {
          if (!settings || !settings.locked || !tempInteractive) return
          tempInteractive = false
          container.classList.remove('temp-unlocked')
          updateTempInteraction()
        })

        // ── IPC via window.api ──
        api.onInitSettings(function (s) {
          applySettings(s)
        })
        api.onTrackUpdate(function (data) {
          mergedLines = buildMergedLyrics(data.lyrics, data.translatedLyrics)
          activeIndex = -1
          activeWordIndex = -1
          var sourceLabel = buildSourceLabel(data)
          if (data.title) {
            songInfoEl.textContent =
              (data.artist ? data.artist + ' - ' : '') +
              data.title +
              (sourceLabel ? ' · ' + sourceLabel : '')
          } else {
            songInfoEl.textContent = sourceLabel
          }
          songInfoEl.title = sourceLabel
          renderLines()
        })
        api.onTimeUpdate(function (time) {
          currentTime = time
          updateActiveIndex()
        })
        api.onSettingsUpdate(function (s) {
          applySettings(s)
        })

        // Dragging is handled natively by -webkit-app-region: drag on #lyrics-container.
        // The main process 'move' event handler auto-saves the window position.

        // ── Close button ──
        btnClose.addEventListener('click', function () {
          api.requestClose()
        })
        fontSelect.addEventListener('change', function () {
          updateSettingsPatch({ fontFamily: fontSelect.value })
        })
        weightSelect.addEventListener('change', function () {
          updateSettingsPatch({ fontWeight: Number(weightSelect.value) })
        })
        alignSelect.addEventListener('change', function () {
          updateSettingsPatch({ align: alignSelect.value })
        })
        btnFontDecrease.addEventListener('click', function () {
          updateSettingsPatch({ fontSize: Math.max(12, settings.fontSize - 2) })
        })
        btnFontIncrease.addEventListener('click', function () {
          updateSettingsPatch({ fontSize: Math.min(80, settings.fontSize + 2) })
        })
        btnColor.addEventListener('click', function (event) {
          event.stopPropagation()
          setColorPanelOpen(colorPanel.hidden)
        })
        colorPanel.addEventListener('click', function (event) {
          event.stopPropagation()
        })
        colorDefault.addEventListener('input', function () {
          updateSettingsPatch({ color: colorDefault.value })
        })
        colorHighlight.addEventListener('input', function () {
          updateSettingsPatch({ highlightColor: colorHighlight.value })
        })
        colorBackground.addEventListener('input', function () {
          updateSettingsPatch({ bgColor: colorBackground.value })
        })
        opacityBackground.addEventListener('input', function () {
          opacityBackgroundValue.textContent = opacityBackground.value + '%'
          updateSettingsPatch({ bgOpacity: Number(opacityBackground.value) })
        })
        document.addEventListener('click', function () {
          setColorPanelOpen(false)
        })
        btnLock.addEventListener('click', function () {
          if (!settings) return
          var nextLocked = !settings.locked
          updateSettingsPatch({ locked: nextLocked, clickThrough: nextLocked })
          if (!nextLocked && tempInteractive) {
            tempInteractive = false
            container.classList.remove('temp-unlocked')
            updateTempInteraction()
          }
        })
      })()
    </script>
  </body>
</html>
