appId: com.TwilightEcho.music
productName: TwilightEcho
directories:
  buildResources: build
asar: true
icon: build/icon.png
files:
  - out/**
  - node_modules/**
  - package.json
  - '!out/renderer/audio-engine/**'
  - '!out/renderer/plugins/**'
  - '!out/renderer/plugin-index/**'
  - '!out/renderer/font/Alibaba-PuHuiTi-Medium.ttf'
  - '!node_modules/**/{test,tests,__tests__,docs,doc,example,examples,benchmark,benchmarks}/**'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.ts'
  - '!node_modules/**/*.md'
  - '!node_modules/@neteasecloudmusicapienhanced/api/public/**'
extraResources:
  - from: resources/audio-engine
    to: audio-engine
    filter:
      - '**/*'
  - from: resources/plugins
    to: plugins
    filter:
      - '**/*'
  - from: resources/plugin-index
    to: plugin-index
    filter:
      - '**/*'
win:
  executableName: TwilightEcho
  icon: build/icon.ico
  signAndEditExecutable: false
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
