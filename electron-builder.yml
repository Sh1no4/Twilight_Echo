appId: com.TwilightEcho.music
productName: TwilightEcho
directories:
  buildResources: build
asar: true
compression: maximum
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
icon: build/icon.png
afterPack: scripts/after-pack-windows.cjs
files:
  - out/**
  - package.json
  - '!out/renderer/audio-engine/**'
  - '!out/renderer/plugins/**'
  - '!out/renderer/plugin-index/**'
  # Keep Inter/Jakarta + MiSans subsets + full MiSans; strip legacy TTF/OTF/WOFF.
  - '!out/renderer/font/Alibaba-PuHuiTi-Medium.ttf'
  - '!out/renderer/font/Outfit-**'
  - '!out/renderer/font/**/*.{ttf,otf,woff}'
  - '!node_modules/**/{test,tests,__tests__,docs,doc,example,examples,benchmark,benchmarks}/**'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.ts'
  - '!node_modules/**/*.md'
  - '!node_modules/@neteasecloudmusicapienhanced/api/public/**'
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  - from: resources/audio-engine
    to: audio-engine
    filter:
      - '**/*'
  - from: resources/plugins
    to: plugins
    filter:
      - '**/*'
  - from: resources/plugin-index
    to: plugin-index
    filter:
      - '**/*'
win:
  executableName: TwilightEcho
  icon: build/icon.ico
  # Personal-project Windows packages are intentionally unsigned. Release integrity is provided
  # by the generated SHA-256 companion file and the fail-closed artifact checks.
  signAndEditExecutable: false
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # deb is assembled deterministically by scripts/build-linux-deb.cjs
  # (electron-builder's bundled fpm needs legacy libcrypt.so.1).
  target:
    - AppImage
    - tar.gz
  maintainer: Twilight Echo Developers <dev@twilight-echo.app>
  vendor: Twilight Echo
  category: AudioVideo
  synopsis: Local and streaming music player with lyrics and DSP
  description: >-
    Twilight Echo is a cross-platform music player for local libraries and
    NetEase Cloud Music streaming, featuring synchronized and word-level
    lyrics, an integrated DSP rack / equalizer, and high-resolution audio
    playback (including DSD).
deb:
  artifactName: ${name}-${version}.${ext}
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
