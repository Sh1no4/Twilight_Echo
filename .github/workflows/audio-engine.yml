name: Audio Engine

on:
  push:
    paths:
      - "audio-engine/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/audio-engine.yml"
  pull_request:
    paths:
      - "audio-engine/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/audio-engine.yml"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Configure audio engine
        run: cmake -S audio-engine -B audio-engine/build/default -DTAE_BUILD_NAPI=OFF

      - name: Build audio engine
        run: cmake --build audio-engine/build/default --config Debug

      - name: Test audio engine
        run: ctest --test-dir audio-engine/build/default --output-on-failure -C Debug
