name: Build Tauri (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'src/preload/**'
      - 'vite.config.ts'
      - 'vite.plugin-host.config.ts'
      - 'vite.audio-engine.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-tauri.yml'

permissions:
  contents: read

concurrency:
  group: tauri-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-windows:
    name: Tauri shell (Windows x64, NSIS / MSI)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up MinGW native audio toolchain
        run: |
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "W64DEVKIT_ROOT=$RUNNER_TEMP/w64devkit" >> "$GITHUB_ENV"
          echo "TWILIGHT_GNU_PATCH=C:\Program Files\Git\usr\bin\patch.exe" >> "$GITHUB_ENV"
          # w64devkit ships a BusyBox patch; Git for Windows patch is preferred.
          choco install w64devkit -y --no-progress
          choco install vcpkg -y --no-progress

      - name: Configure + build native audio engine (MinGW static) and stage it
        run: |
          pnpm run configure:audio-engine:mingw
          pnpm run build:audio-engine:mingw

      - name: Build sidecars and stage Node runtime + native engine
        run: pnpm run build:plugin-host && pnpm run build:audio-engine:node && pnpm run stage:node-runtime

      - name: Test Tauri Rust crate
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Run Tauri release gate
        run: pnpm run test:tauri-gate

      - name: Build Tauri app (typecheck + renderer + Rust shell + bundles)
        run: pnpm run build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: twilight-echo-tauri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
